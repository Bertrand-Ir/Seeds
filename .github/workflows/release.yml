# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app checks the latest release and offers to update itself.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: v
        run: |
          BASE=$(grep '^seeds.versionName=' gradle.properties | cut -d= -f2 | cut -d. -f1-2)
          echo "name=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SEEDS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret SEEDS_KEYSTORE_BASE64. See README → Releases & self-update."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/seeds-release.jks"

      - name: Build signed APK
        env:
          SEEDS_KEYSTORE_PATH: ${{ runner.temp }}/seeds-release.jks
          SEEDS_KEYSTORE_PASSWORD: ${{ secrets.SEEDS_KEYSTORE_PASSWORD }}
          SEEDS_KEY_ALIAS: ${{ secrets.SEEDS_KEY_ALIAS }}
          SEEDS_KEY_PASSWORD: ${{ secrets.SEEDS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-configuration-cache \
            -Pseeds.versionName=${{ steps.v.outputs.name }} \
            -Pseeds.versionCode=${{ steps.v.outputs.code }} \
            -Pseeds.githubRepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk "seeds-${{ steps.v.outputs.name }}.apk"

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "### What's new"
            if [ -n "$PREV" ]; then git log "$PREV"..HEAD --no-merges --pretty='- %s'; else git log -20 --no-merges --pretty='- %s'; fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Seeds ${{ steps.v.outputs.name }}
          body_path: notes.md
          files: seeds-${{ steps.v.outputs.name }}.apk
          make_latest: "true"
