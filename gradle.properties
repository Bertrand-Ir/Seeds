org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release identity. CI overrides versionName/versionCode/githubRepo automatically.
seeds.versionName=1.0.0
seeds.versionCode=1
# owner/repo on GitHub that publishes Seeds releases (used by the in-app updater).
seeds.githubRepo=OWNER/seeds
